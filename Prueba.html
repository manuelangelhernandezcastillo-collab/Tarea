<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <title>Mi horario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: red;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
            margin: auto;
            font-size: 20px;
        }

        th, td {
            border: 2px solid gray;
            padding: 12px 8px;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }

        .idp {
            background-color: #e6e6ff;
        }

        .itk {
            background-color: #d9f2ff;
        }

        .gtb {
            background-color: #fff0cc;
        }

        .lnd {
            background-color: #d9f2d9;
        }

        .ikl {
            background-color: #ffe0e0;
        }
        .pni {
            background-color: #e69595;
        }
        .fuw {
            background-color: #dab584;
        }
        .djk {
            background-color: #8078ca;
        }
    </style>
</head>

<body>

    <h1>HORARIO</h1>

    <table>
        <tr>
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>

        <tr>
            <td>15:00 -<br>15:55</td>
            <td class="idp" rowspan="2" colspan="2">IDP</td>
            <td class="itk">ITK</td>
            <td class="itk" rowspan="2">ITK</td>
            <td class="gtb" rowspan="2">GTB</td>
        </tr>

        <tr>
            <td>16:00 -<br>16:50</td>
            <td class="gtb">GTB</td>
        </tr>

        <tr>
            <td>16:50 -<br>17:45</td>
            <td class="lnd">LND</td>
            <td class="gtb">GTB</td>
            <td class="ikl">IKL</td>
            <td class="lnd">LND</td>
            <td class="ikl">IKL</td>
        </tr>
        <tr>
            <td>17:45 -<br>18:00</td>
            <td colspan="5" style="background-color: #ccc8c8;">Recreo</td>
        </tr>

        <tr>
            <td>18:00 -<br>18:55</td>
            <td class="lnd">LND</td>
            <td class="gtb">GTB</td>
            <td class="pni">PNI</td>
            <td class="lnd">LND</td>
            <td class="fuw">FUW</td>
        </tr>

        <tr>
            <td>19:00 -<br>19:50</td>
            <td class="pni" rowspan="2">PNI</td>
            <td class="fuw" rowspan="2">FUW</td>
            <td class="djk" rowspan="2">DJK</td>
            <td class="pni" rowspan="2">PNI</td>
            <td class="idp" rowspan="2">IDP</td>
        </tr>
        <tr>
            <td>20:00 -<br>20:50</td>
        </tr>

    </table>

</body>
</html>
